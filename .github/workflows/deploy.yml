name: Deploy securepay-admin to Cloudflare Pages

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Vite 8 needs Node ^20.19 or >=22.12 (the 18.x used by older client
        # projects will fail on `vite build`).
        node-version: [22.x]

    steps:
      # checkout the repository content to github runner
      - name: Checkout
        uses: actions/checkout@v4

      # setup nodejs environment
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # install dependencies (package-lock.json is committed, so ci is exact)
      - name: Install dependencies
        run: npm ci

      # build the react app (Vite writes to dist/, not build/)
      # Vite inlines VITE_* values at BUILD time. This app reads only one.
      - name: Build
        run: npm run build
        env:
          # REQUIRED. Backend (Django) base URL, e.g. https://api.example.com
          # with no trailing slash. Left unset the app falls back to
          # http://127.0.0.1:8000, which cannot work from a visitor's browser.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.DEPLOY_APP_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.DEPLOY_APP_CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=escrosafe-admin --branch=main
